<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>출고 관리 시스템</title>
<style>
:root{
  --bg:#111;--bg2:#1a1a1a;--bg3:#222;--bg4:#2c2c2c;--bg5:#363636;
  --border:#2e2e2e;--border2:#3a3a3a;
  --text:#f0f0f0;--text2:#c8c8c8;--text3:#888;--text4:#555;
  --gold:#b8963c;--gold2:#c8a84a;--gold3:#6a5010;
  --gold-bg:#181400;--gold-bdr:#3a2c00;--gold-txt:#b8963c;
  --red:#cc4444;--red-bg:#220a0a;
  --green:#44aa66;--green-bg:#0a2218;--green2:#339955;
  --blue:#4488bb;--blue-bg:#0a1a28;
  --purple:#7755bb;--purple-bg:#130e28;
  --shadow:0 4px 20px rgba(0,0,0,.5);
}
body.light{
  --bg:#f5f5f5;--bg2:#ffffff;--bg3:#eeeeee;--bg4:#e4e4e4;--bg5:#d8d8d8;
  --border:#ddd;--border2:#ccc;
  --text:#111;--text2:#333;--text3:#666;--text4:#999;
  --gold:#8a6800;--gold2:#9a7800;--gold3:#6a5000;
  --gold-bg:#faf6e8;--gold-bdr:#d4b84a;--gold-txt:#6a5000;
  --red:#aa2222;--red-bg:#fceaea;
  --green:#226644;--green-bg:#eaf4ee;--green2:#1a5535;
  --blue:#1a5588;--blue-bg:#eaf2fa;
  --purple:#442288;--purple-bg:#f0eafa;
  --shadow:0 2px 10px rgba(0,0,0,.1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;min-height:100vh;}
.nav{background:var(--bg2);border-bottom:1px solid var(--border2);display:flex;align-items:stretch;position:sticky;top:0;z-index:200;}


.nav-tab{padding:14px 18px;font-size:13px;cursor:pointer;color:var(--text3);border-bottom:3px solid transparent;border:none;background:none;font-family:inherit;white-space:nowrap;transition:all .2s;}
.nav-tab.active{color:var(--text);border-bottom:2px solid var(--text3);}
.nav-tab:hover{color:var(--text2);}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;padding-right:14px;}
.nav-clock{font-size:11px;color:var(--text4);}
.theme-btn{background:none;border:1px solid var(--border2);color:var(--text3);border-radius:16px;padding:5px 11px;font-size:11px;cursor:pointer;font-family:inherit;}
.theme-btn:hover{border-color:var(--gold);color:var(--gold);}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text4);}
.sync-dot.ok{background:var(--green);}
.sync-dot.err{background:var(--red);}

.panel{display:none;}
.panel.active{display:block;}

/* INPUT */
.input-wrap{padding:20px;max-width:680px;margin:0 auto;}
.form-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:26px;box-shadow:var(--shadow);}
.form-card h2{font-size:16px;color:var(--text2);margin-bottom:20px;}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:11px;color:var(--text3);margin-bottom:5px;letter-spacing:.5px;}
.form-input,.form-select{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:11px 14px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:border-color .2s;}
.form-input:focus,.form-select:focus{border-color:var(--gold);}
.form-select{cursor:pointer;}
.items-list{display:flex;flex-direction:column;gap:7px;margin-bottom:8px;}
.item-row{display:grid;grid-template-columns:1fr .5fr 32px;gap:6px;align-items:center;}
.btn-rm{background:var(--red-bg);border:none;color:var(--red);border-radius:7px;width:32px;height:38px;cursor:pointer;font-size:14px;}
.btn-add-item{background:var(--purple-bg);border:1px dashed var(--purple);color:var(--purple);border-radius:8px;padding:9px;width:100%;font-size:13px;cursor:pointer;font-family:inherit;}
.memo-row{background:var(--gold-bg);border:1px solid var(--gold-bdr);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
.memo-row label{color:var(--gold-txt);font-size:11px;display:block;margin-bottom:5px;}
.memo-row .form-input{background:var(--bg);border-color:var(--gold-bdr);color:var(--gold2);}
.btn-submit{width:100%;background:var(--gold);color:#000;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.5px;}
.btn-submit:active{opacity:.75;}

/* MONITOR */
.monitor-toolbar{display:flex;gap:8px;padding:10px 14px;align-items:center;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.btn-tool{border:none;border-radius:8px;padding:7px 13px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;}
.btn-dl{background:var(--green-bg);color:var(--green);border:1px solid var(--green);}
.btn-clear{background:var(--red-bg);color:var(--red);border:1px solid var(--red);}
.date-nav{display:flex;align-items:center;gap:6px;margin-left:auto;}
.date-nav button{background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px;}
.date-nav button:hover{border-color:var(--gold);}
.date-nav .cur-date{font-size:13px;color:var(--gold2);font-weight:700;min-width:90px;text-align:center;}
.done-badge{font-size:11px;color:var(--text4);background:var(--bg3);padding:4px 10px;border-radius:12px;}

.monitor-wrap{display:grid;grid-template-columns:1fr 1.6fr .9fr;gap:12px;height:calc(100vh - 115px);padding:12px;}
.col{display:flex;flex-direction:column;overflow:hidden;}
.col-header{padding:12px 16px;border-radius:12px 12px 0 0;font-weight:700;text-align:center;flex-shrink:0;letter-spacing:1px;}
.col-body{flex:1;overflow-y:auto;padding:7px;border-radius:0 0 12px 12px;border:1px solid var(--border);border-top:none;background:var(--bg);}
.col-wait .col-header{background:var(--bg4);color:var(--text3);font-size:14px;}
.col-active .col-header{background:var(--gold);color:#000;font-size:20px;}
.col-done .col-header{background:var(--bg3);color:var(--text4);font-size:13px;}

.order-card{border-radius:11px;padding:14px;margin-bottom:9px;transition:transform .15s;}
.order-card:hover{transform:translateY(-2px);}
.card-wait{background:var(--bg3);border:1px solid var(--border2);}
.card-active{background:var(--bg2);border:2px solid var(--gold);box-shadow:0 0 18px rgba(201,168,76,.15);}
.card-done{background:var(--bg3);border:1px solid var(--border);opacity:.8;}

.c-customer-wait{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--border);}
.c-customer-active{font-size:17px;font-weight:700;color:var(--gold2);margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid var(--gold-bdr);}
.c-customer-done{font-size:12px;color:var(--text3);font-weight:700;margin-bottom:5px;}

.c-products{display:flex;flex-direction:column;gap:5px;margin-bottom:7px;}
.c-pline-wait{background:var(--bg);border-radius:7px;padding:7px 10px;display:flex;justify-content:space-between;align-items:center;}
.c-pline-active{background:var(--bg);border-radius:9px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border2);}
.c-pline-done{background:var(--bg);border-radius:6px;padding:5px 8px;display:flex;justify-content:space-between;}
.c-pname-wait{font-size:13px;color:var(--text2);}
.c-pname-active{font-size:16px;color:var(--text);font-weight:600;}
.c-pname-done{font-size:11px;color:var(--text4);}
.c-pqty-wait{font-size:14px;font-weight:800;color:var(--green);background:var(--green-bg);padding:2px 10px;border-radius:5px;white-space:nowrap;}
.c-pqty-active{font-size:26px;font-weight:900;color:var(--green);background:var(--green-bg);padding:4px 14px;border-radius:7px;white-space:nowrap;}
.c-pqty-done{font-size:12px;color:var(--green2);font-weight:700;}

.c-memo{background:var(--gold-bg);border:1px solid var(--gold-bdr);border-radius:6px;padding:5px 9px;font-size:11px;color:var(--gold-txt);margin-top:6px;}
.c-memo-active{background:var(--gold-bg);border:1px solid var(--gold-bdr);border-radius:7px;padding:7px 11px;font-size:13px;color:var(--gold2);margin-top:7px;}
.c-handler{font-size:13px;color:var(--gold);margin-top:8px;font-weight:700;}
.c-time{font-size:10px;color:var(--text4);margin-top:5px;}
.c-timing{font-size:10px;color:var(--text4);margin-top:4px;line-height:1.7;}

.c-photo-upload{margin-top:11px;display:flex;flex-direction:column;gap:6px;}
.c-photo-upload label{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--blue-bg);color:var(--blue);border:1px dashed var(--blue);border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;}
.no-photo-btn{width:100%;background:var(--bg4);color:var(--text4);border:none;border-radius:7px;padding:7px;font-size:11px;cursor:pointer;font-family:inherit;margin-top:5px;}
.photos-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}
.photos-row img{width:50px;height:50px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer;}

.card-actions{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap;}
.act-btn{border:none;border-radius:7px;padding:6px 11px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:700;}
.btn-start{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-bdr);}
.btn-edit{background:var(--bg4);color:var(--text3);}
.btn-del{background:var(--red-bg);color:var(--red);}
.btn-hist{background:var(--bg4);color:var(--text4);font-size:10px;}
.btn-del-hist{background:var(--red-bg);color:var(--red);font-size:10px;}

.history-log{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px;margin-top:7px;font-size:10px;color:var(--text4);line-height:1.9;display:none;}
.history-log.show{display:block;}
.hist-item{padding:2px 0;border-bottom:1px solid var(--border);}
.hist-item:last-child{border:none;}

.empty-msg{color:var(--text4);font-size:13px;text-align:center;padding:28px 10px;}
.loading-msg{color:var(--text4);font-size:12px;text-align:center;padding:20px;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}

/* ALERT BANNER */
.alert-banner{background:var(--red-bg);border:1px solid var(--red);border-radius:10px;padding:10px 14px;margin:10px 14px 0;font-size:13px;color:var(--red);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.alert-banner button{background:var(--red);color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:11px;cursor:pointer;font-family:inherit;margin-left:auto;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:500;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:18px;padding:26px;width:100%;max-width:420px;box-shadow:var(--shadow);max-height:90vh;overflow-y:auto;}
.modal h3{font-size:17px;color:var(--text);margin-bottom:16px;}
.modal-btns{display:flex;gap:8px;margin-top:14px;}
.modal-btns button{flex:1;border:none;border-radius:9px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-modal-ok{background:var(--gold);color:#000;}
.btn-modal-cancel{background:var(--bg4);color:var(--text3);}

.staff-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:4px;}
.staff-btn{background:var(--bg);border:1px solid var(--border2);border-radius:9px;padding:11px;text-align:center;cursor:pointer;transition:all .2s;font-family:inherit;}
.staff-btn:hover,.staff-btn.selected{background:var(--gold-bg);border-color:var(--gold);}
.staff-btn .s-rank{font-size:10px;color:var(--text4);margin-bottom:3px;}
.staff-btn .s-name{font-size:14px;font-weight:700;color:var(--text);}
.staff-btn.selected .s-name{color:var(--gold2);}

.pin-modal-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0;}
.pin-input-big{background:var(--bg);border:2px solid var(--border2);border-radius:10px;padding:12px 20px;color:var(--text);font-size:22px;font-weight:700;text-align:center;letter-spacing:8px;width:180px;outline:none;font-family:inherit;}
.pin-input-big:focus{border-color:var(--gold);}
.pin-err{font-size:12px;color:var(--red);min-height:16px;}

/* ADMIN */
.admin-wrap{padding:20px;max-width:1000px;margin:0 auto;}
.admin-lock{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;}
.admin-lock h2{font-size:20px;color:var(--text2);}
.admin-lock p{font-size:13px;color:var(--text4);}
.admin-pin{background:var(--bg);border:2px solid var(--border2);border-radius:10px;padding:12px 20px;color:var(--text);font-size:22px;font-weight:700;text-align:center;letter-spacing:8px;width:200px;outline:none;font-family:inherit;}
.admin-pin:focus{border-color:var(--gold);}
.btn-unlock{background:var(--gold);color:#000;border:none;border-radius:10px;padding:12px 32px;font-size:15px;font-weight:700;cursor:pointer;}

.admin-section{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px;}
.admin-section h3{font-size:15px;color:var(--gold2);margin-bottom:14px;}

.stat-tabs{display:flex;gap:8px;margin-bottom:16px;}
.stat-tab{background:var(--bg3);border:1px solid var(--border);color:var(--text3);border-radius:8px;padding:7px 16px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;}
.stat-tab.active{background:var(--gold-bg);border-color:var(--gold);color:var(--gold2);}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px;}
.stat-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:13px;text-align:center;}
.stat-box .s-num{font-size:26px;font-weight:900;color:var(--gold2);}
.stat-box .s-label{font-size:10px;color:var(--text4);margin-top:3px;}

.staff-stat-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);}
.staff-stat-row:last-child{border:none;}
.ss-name{font-size:13px;font-weight:700;color:var(--text2);width:70px;}
.ss-bar-wrap{flex:1;background:var(--bg);border-radius:4px;height:9px;overflow:hidden;}
.ss-bar{background:linear-gradient(90deg,var(--gold3),var(--gold2));height:100%;border-radius:4px;transition:width .5s;}
.ss-cnt{font-size:12px;color:var(--gold2);font-weight:700;width:40px;text-align:right;}
.ss-vol{font-size:10px;color:var(--text4);width:60px;text-align:right;}

.cal-wrap{overflow-x:auto;}
.cal-header-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;}
.cal-dow{text-align:center;font-size:10px;color:var(--text4);padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 3px;text-align:center;font-size:11px;min-height:46px;cursor:pointer;}
.cal-day.empty{background:transparent;border:none;}
.cal-day.today{border-color:var(--gold);}
.cal-day.dl-ok{background:var(--green-bg);border-color:var(--green);}
.cal-day.dl-no{background:var(--red-bg);border-color:var(--red);}
.cal-day.dl-extra{background:var(--gold-bg);border-color:var(--gold);}
.cal-day .dn{font-weight:700;color:var(--text2);}
.cal-day .dc{font-size:9px;color:var(--text4);margin-top:2px;}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
.cal-li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);}
.cal-dot{width:9px;height:9px;border-radius:2px;}

.staff-list-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);}
.staff-list-item:last-child{border:none;}
.sl-rank{font-size:11px;color:var(--text4);width:40px;}
.sl-name{font-size:14px;font-weight:700;color:var(--text2);flex:1;}
.sl-del{background:var(--red-bg);border:none;color:var(--red);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;}
.staff-add-row{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;}
.btn-staff-add{background:var(--gold-bg);color:var(--gold2);border:1px solid var(--gold-bdr);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}

.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:600;align-items:center;justify-content:center;}
.lightbox.show{display:flex;}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:10px;}
.lightbox-close{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border2);color:var(--text);padding:9px 20px;border-radius:22px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:999;white-space:nowrap;box-shadow:var(--shadow);}
.toast.show{opacity:1;}

  .nav-right{gap:5px;padding-right:8px;}
  .nav-clock{display:none;}
  .date-nav .cur-date{min-width:75px;font-size:12px;}

}

/* SOUND SELECTOR */
.sound-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
.sound-card{background:var(--bg);border:1px solid var(--border2);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:8px;}
.sound-card:hover{border-color:var(--text3);}
.sound-card.selected{border-color:var(--gold);background:var(--gold-bg);}
.sound-card .sc-icon{font-size:22px;text-align:center;}
.sound-card .sc-name{font-size:13px;font-weight:700;color:var(--text2);text-align:center;}
.sound-card .sc-desc{font-size:10px;color:var(--text4);text-align:center;line-height:1.4;}
.sound-preview{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;}
.btn-preview{background:var(--bg3);border:1px solid var(--border2);color:var(--text3);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;}
.btn-preview:hover{border-color:var(--text3);color:var(--text2);}
.sound-card.selected .sc-name{color:var(--gold2);}

// ══ SUPABASE API ══
async function sb(path,method='GET',body=null){
  const opts={method,headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'}};
  if(body)opts.body=JSON.stringify(body);
  try{
    const r=await fetch(SB_URL+path,opts);
    setSyncDot(r.ok);
    if(r.status===204)return[];
    return await r.json();
  }catch(e){setSyncDot(false);return null;}
}

async function sbUploadPhoto(filename,dataUrl){
  const base64=dataUrl.split(',')[1];
  const bytes=Uint8Array.from(atob(base64),c=>c.charCodeAt(0));
  const blob=new Blob([bytes],{type:'image/jpeg'});
  const r=await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${filename}`,{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'image/jpeg','x-upsert':'true'},
    body:blob
  });
  setSyncDot(r.ok);
  if(r.ok)return`${SB_URL}/storage/v1/object/public/${BUCKET}/${filename}`;
  return null;
}

async function sbDeletePhotos(filenames){
  if(!filenames||!filenames.length)return;
  await fetch(`${SB_URL}/storage/v1/object/${BUCKET}`,{
    method:'DELETE',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({prefixes:filenames})
  });
}

function setSyncDot(ok){

// ══ DATE ══
function todayStr(){return new Date().toISOString().slice(0,10);}
function timeStr(){return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});}
function elapsed(t1,t2){
  if(!t1||!t2)return'';
  const p=t=>{const[h,m]=t.replace(/오[전후] /,'').split(':').map(Number);return h*60+m;};
  try{const d=Math.abs(p(t2)-p(t1));return d+'분';}catch(e){return'';}
}
function weekRange(){
  const now=new Date();
  const day=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-day+1);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  return[mon.toISOString().slice(0,10),sun.toISOString().slice(0,10)];
}
function monthRange(){
  const now=new Date();
  const first=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10);
  const last=new Date(now.getFullYear(),now.getMonth()+1,0).toISOString().slice(0,10);
  return[first,last];
}

// ══ COMPRESS PHOTO ══
async function compressPhoto(dataUrl,maxW=800,quality=0.7){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxW/img.width);
      const c=document.createElement('canvas');
      c.width=img.width*scale;c.height=img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',quality));
    };
    img.src=dataUrl;
  });
}

  document.getElementById('btn-submit-ref') && (document.getElementById('btn-submit-ref').disabled=true);
  const res=await sb('/rest/v1/orders','POST',o);

function photoThumbs(o){
  if(!o.photos||!o.photos.length)return'';
  return`<div class="photos-row">${o.photos.map((p,i)=>`<img src="${p.url||p.dataUrl||''}" onclick="openLightbox(${o.id},${i})" title="${p.filename||''}"/>`).join('')}</div>`;
}
function memoHtml(o,cls){return o.memo?`<div class="${cls}">📝 ${esc(o.memo)}</div>`:'';}
function histHtml(o){
  if(!o.history||!o.history.length)return'이력 없음';
  return o.history.map(h=>`<div class="hist-item">${esc(h.time)} — ${esc(h.action)}${h.by?' ('+esc(h.by)+')':''}</div>`).join('');
}

function startOrder(id){
  pendingId=id;selectedStaff=null;
  const grid=document.getElementById('staffGrid');
  grid.innerHTML=staffList.map((s,i)=>`
    <div class="staff-btn" onclick="selectStaff(${i},this)">
      <div class="s-rank">${esc(s.rank)}</div>
      <div class="s-name">${esc(s.name)}</div>
    </div>`).join('');
  openModal('modalStaff');
}
function selectStaff(i,el){
  document.querySelectorAll('.staff-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');selectedStaff=staffList[i];
}
async function confirmStaff(){
  if(!selectedStaff){showToast('담당자를 선택하세요');return;}
  const o=orders.find(o=>o.id===pendingId);if(!o)return;
  o.status='active';o.handler=selectedStaff.name;
  o.history=[...(o.history||[]),{time:timeStr(),action:'진행중 전환',by:selectedStaff.name}];
  await sb(`/rest/v1/orders?id=eq.${o.id}`,'PATCH',{status:'active',handler:o.handler,history:o.history});
  closeModal('modalStaff');renderMonitor();
  showToast('✅ '+o.customer+' → '+selectedStaff.name);
}

async function doneOrder(id){
  const o=orders.find(o=>o.id===id);if(!o)return;
  o.status='done';o.time_done=timeStr();
  o.history=[...(o.history||[]),{time:timeStr(),action:'완료',by:o.handler||'사무실'}];
  await sb(`/rest/v1/orders?id=eq.${o.id}`,'PATCH',{status:'done',time_done:o.time_done,history:o.history});
  renderMonitor();showToast('🎉 '+o.customer+' 완료!');
}

async function photoAndDone(input,id){
  const file=input.files[0];if(!file)return;
  showToast('📤 업로드 중...');
  const reader=new FileReader();
  reader.onload=async e=>{
    const compressed=await compressPhoto(e.target.result);
    const o=orders.find(o=>o.id===id);if(!o)return;
    const fname=o.date+'_'+o.customer.replace(/[^가-힣a-zA-Z0-9]/g,'_').slice(0,20)+'_'+Date.now()+'.jpg';
    const url=await sbUploadPhoto(fname,compressed);
    const photos=[...(o.photos||[]),{filename:fname,url:url||compressed}];
    o.photos=photos;o.status='done';o.time_done=timeStr();
    o.history=[...(o.history||[]),{time:timeStr(),action:'사진+완료',by:o.handler||'-'}];
    await sb(`/rest/v1/orders?id=eq.${o.id}`,'PATCH',{photos,status:'done',time_done:o.time_done,history:o.history});
    renderMonitor();showToast('📸 완료!');
  };
  reader.readAsDataURL(file);input.value='';
}

// ══ EDIT ══
function openEdit(id){
  editingId=id;editRowCount=0;
  const o=orders.find(o=>o.id===id);if(!o)return;
  document.getElementById('editCustomer').value=o.customer||'';
  document.getElementById('editMemo').value=o.memo||'';
  const list=document.getElementById('editItemsList');list.innerHTML='';
  (o.items||[]).forEach(it=>addEditRow(it.product,it.qty));
  if(!(o.items||[]).length)addEditRow();
  openModal('modalEdit');
}
function addEditRow(p='',q=''){
  editRowCount++;const id='er'+editRowCount;
  const d=document.createElement('div');d.className='item-row';d.id=id;
  d.innerHTML=`<input class="form-input" placeholder="품목명" value="${esc(p)}" data-f="p"/>
    <input class="form-input" placeholder="수량" value="${esc(q)}" data-f="q"/>
    <button class="btn-rm" onclick="document.getElementById('${id}').remove()">✕</button>`;
  document.getElementById('editItemsList').appendChild(d);
}
async function saveEdit(){
  const o=orders.find(o=>o.id===editingId);if(!o)return;
  const nc=document.getElementById('editCustomer').value.trim();
  const nm=document.getElementById('editMemo').value.trim();
  const ni=getItems('editItemsList');
  const changes=[];
  if(o.customer!==nc)changes.push('고객정보');
  if(o.memo!==nm)changes.push('메모');
  if(JSON.stringify(o.items)!==JSON.stringify(ni))changes.push('품목');
  o.customer=nc;o.memo=nm;o.items=ni;
  if(changes.length)o.history=[...(o.history||[]),{time:timeStr(),action:'수정: '+changes.join(', '),by:'관리자'}];
  await sb(`/rest/v1/orders?id=eq.${o.id}`,'PATCH',{customer:nc,memo:nm,items:ni,history:o.history});
  closeModal('modalEdit');renderMonitor();showToast('✅ 수정 완료');
}

async function clearHistory(id){
  if(!confirm('이력을 삭제하시겠습니까?'))return;
  const o=orders.find(o=>o.id===id);if(!o)return;
  o.history=[];
  await sb(`/rest/v1/orders?id=eq.${o.id}`,'PATCH',{history:[]});
  renderMonitor();showToast('이력 삭제됨');
}

async function checkAlertBanner(){
  await loadMeta();

  const yMeta=metaMap[yStr];

    wrap.innerHTML=`<div class="alert-banner">⚠️ ${yStr} 출고 내역 미저장 (${yCnt}건)

      <button onclick="downloadDateExcel('${yStr}')">지금 저장</button></div>`;

// ══ DOWNLOAD ══
async function downloadMonthExcel(){
  const[first,last]=monthRange();
  const data=await sb(`/rest/v1/orders?date=gte.${first}&date=lte.${last}&order=id.asc`);
  if(!data||!data.length){showToast('이번 달 데이터 없음');return;}
  buildAndDownloadCsv(data,first.slice(0,7));
  // mark each date
  const dates=[...new Set(data.map(o=>o.date))];
  for(const d of dates){
    const cnt=data.filter(o=>o.date===d).length;
    await sb('/rest/v1/meta','POST',{date:d,downloaded:true,downloaded_at:timeStr(),order_count:cnt});
  }
  showToast('📥 이번 달 저장 완료!');
  checkAlertBanner();
}
async function downloadDateExcel(date){
  const data=await sb(`/rest/v1/orders?date=eq.${date}&order=id.asc`);
  if(!data||!data.length){showToast('데이터 없음');return;}
  buildAndDownloadCsv(data,date);
  await sb('/rest/v1/meta','POST',{date,downloaded:true,downloaded_at:timeStr(),order_count:data.length});
  showToast('📥 '+date+' 저장 완료!');
  checkAlertBanner();if(adminUnlocked)renderCalendar();
}
function buildAndDownloadCsv(data,label){
  const rows=[['날짜','등록시간','완료시간','소요시간','고객정보','품목','수량','메모','담당자','상태','사진파일명','수정이력']];
  data.forEach(o=>{
    const pics=(o.photos||[]).map(p=>p.filename||'').join('|');
    const hist=(o.history||[]).map(h=>h.time+' '+h.action).join(' / ');
    const el=elapsed(o.time_created,o.time_done);
    (o.items||[{product:'',qty:''}]).forEach((it,i)=>{
      rows.push([i===0?o.date:'',i===0?(o.time_created||''):'',i===0?(o.time_done||''):'',
        i===0?el:'',i===0?o.customer:'',it.product,it.qty,
        i===0?(o.memo||''):'',i===0?(o.handler||''):'',
        i===0?(o.status==='done'?'완료':o.status==='active'?'진행중':'대기'):'',
        i===0?pics:'',i===0?hist:'']);
    });
  });
  const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='출고내역_'+label+'.csv';a.click();
}

function switchStatTab(tab,el){
  curStatTab=tab;
  document.querySelectorAll('.stat-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderStats(tab);
}
function renderStats(tab){
  let filtered=orders;
  if(tab==='today') filtered=orders.filter(o=>o.date===todayStr());
  else if(tab==='week'){const[s,e]=weekRange();filtered=orders.filter(o=>o.date>=s&&o.date<=e);}
  else if(tab==='month'){const[s,e]=monthRange();filtered=orders.filter(o=>o.date>=s&&o.date<=e);}
  const done=filtered.filter(o=>o.status==='done');
  const totalVol=done.reduce((s,o)=>(o.items||[]).reduce((ss,it)=>{
    const m=String(it.qty||'').match(/(\d+(\.\d+)?)/);return ss+(m?parseFloat(m[1]):0);
  },s),0);
  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-box"><div class="s-num">${filtered.length}</div><div class="s-label">전체 주문</div></div>
    <div class="stat-box"><div class="s-num">${done.length}</div><div class="s-label">완료</div></div>
    <div class="stat-box"><div class="s-num">${filtered.length-done.length}</div><div class="s-label">미완료</div></div>
    <div class="stat-box"><div class="s-num">${Math.round(totalVol)}</div><div class="s-label">수량 합계</div></div>`;
  const sm={};done.filter(o=>o.handler).forEach(o=>{
    if(!sm[o.handler])sm[o.handler]={cnt:0,vol:0};
    sm[o.handler].cnt++;
    sm[o.handler].vol+=(o.items||[]).reduce((s,it)=>{
      const m=String(it.qty||'').match(/(\d+(\.\d+)?)/);return s+(m?parseFloat(m[1]):0);
    },0);
  });
  const entries=Object.entries(sm).sort((a,b)=>b[1].cnt-a[1].cnt);
  const mx=entries.length?entries[0][1].cnt:1;
  document.getElementById('staffStats').innerHTML=entries.length?entries.map(([name,d])=>`
    <div class="staff-stat-row">
      <div class="ss-name">${esc(name)}</div>
      <div class="ss-bar-wrap"><div class="ss-bar" style="width:${(d.cnt/mx*100).toFixed(0)}%"></div></div>
      <div class="ss-cnt">${d.cnt}건</div>
      <div class="ss-vol">${Math.round(d.vol)} 수량</div>
    </div>`).join(''):'<div style="color:var(--text4);font-size:13px;padding:10px">데이터 없음</div>';
}
function renderCalendar(){
  const now=new Date();const yr=now.getFullYear();const mo=now.getMonth();
  const first=new Date(yr,mo,1).getDay();const last=new Date(yr,mo+1,0).getDate();
  const today=todayStr();
  const om={};orders.forEach(o=>{if(!om[o.date])om[o.date]=0;om[o.date]++;});
  let cells='';
  for(let i=0;i<first;i++)cells+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=last;d++){
    const ds=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const m=metaMap[ds];const cnt=om[ds]||0;
    let cls='cal-day';
    if(ds===today)cls+=' today';
    if(cnt>0){
      if(m&&m.downloaded){cls+=orders.filter(o=>o.date===ds).length>(m.order_count||0)?' dl-extra':' dl-ok';}
      else cls+=' dl-no';
    }
    cells+=`<div class="${cls}"><div class="dn">${d}</div>${cnt?`<div class="dc">${cnt}건</div>`:''}</div>`;
  }
  document.getElementById('calGrid').innerHTML=cells;
}

        o.connect(g);g.connect(m);o.frequency.value=f;o.type=t;
        const st=ctx.currentTime+s;
        g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.6,st+a);
        g.gain.exponentialRampToValueAtTime(0.001,st+a+d);
        o.start(st);o.stop(st+a+d+.1);
      });
    }
  },
  {
    id:'ding_dong',
    icon:'🚪',
    name:'딩동',
    desc:'현관벨 스타일 / 친숙하고 명확한 알림',
    fn:(ctx,m)=>{
      [[784,0,0.01,0.4,'sine'],[587,0.22,0.01,0.5,'sine']
      ].forEach(([f,s,a,d])=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(m);o.frequency.value=f;o.type='sine';
        const st=ctx.currentTime+s;
        g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.7,st+a);
        g.gain.exponentialRampToValueAtTime(0.001,st+a+d);
        o.start(st);o.stop(st+a+d+.1);

  },

    id:'buzzer',
    icon:'📢',
    name:'버저',
    desc:'강렬한 경고 버저 / 확실한 주의 환기',
    fn:(ctx,m)=>{
      [0,0.18,0.36].forEach(s=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(m);o.frequency.value=220;o.type='sawtooth';
        const st=ctx.currentTime+s;
        g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(1,st+0.02);
        g.gain.setValueAtTime(1,st+0.1);
        g.gain.linearRampToValueAtTime(0,st+0.14);
        o.start(st);o.stop(st+0.16);
      });
    }
  },
  {
    id:'ping',
    icon:'✨',
    name:'알림 핑',
    desc:'가볍고 깔끔한 핑 / 방해 없는 알림',
    fn:(ctx,m)=>{
      [[1200,0,0.005,0.3,'sine'],[1800,0.08,0.005,0.25,'sine']
      ].forEach(([f,s,a,d])=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(m);o.frequency.value=f;o.type='sine';
        const st=ctx.currentTime+s;
        g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.5,st+a);
        g.gain.exponentialRampToValueAtTime(0.001,st+a+d);
        o.start(st);o.stop(st+a+d+.05);
      });
    }
  },
  {
    id:'alarm',
    icon:'🚨',
    name:'경보음',
    desc:'빠른 반복 경보 / 긴급 상황용',
    fn:(ctx,m)=>{
      for(let i=0;i<6;i++){
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(m);
        o.frequency.value=i%2===0?960:800;o.type='square';
        const st=ctx.currentTime+i*0.1;
        g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.8,st+0.01);
        g.gain.setValueAtTime(0.8,st+0.07);g.gain.linearRampToValueAtTime(0,st+0.09);
        o.start(st);o.stop(st+0.1);
      }
    }
  },
  {
    id:'military',
    icon:'📡',
    name:'군 신호음',
    desc:'짧고 단호한 신호 / 명확한 지시 느낌',
    fn:(ctx,m)=>{
      [[440,0,0.02,0.08,'square'],[440,0.12,0.02,0.08,'square'],
       [880,0.24,0.02,0.16,'square']
      ].forEach(([f,s,a,d])=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(m);o.frequency.value=f;o.type='square';
        const st=ctx.currentTime+s;
        g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.9,st+a);
        g.gain.exponentialRampToValueAtTime(0.001,st+a+d);

  {
    id:'beep',
    icon:'📟',
    name:'단순 비프',
    desc:'심플한 단일 비프 / 가장 기본적인 알림',
    fn:(ctx,m)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(m);o.frequency.value=1000;o.type='sine';
      g.gain.setValueAtTime(0,ctx.currentTime);
      g.gain.linearRampToValueAtTime(0.8,ctx.currentTime+0.01);
      g.gain.setValueAtTime(0.8,ctx.currentTime+0.15);
      g.gain.linearRampToValueAtTime(0,ctx.currentTime+0.18);
      o.start(ctx.currentTime);o.stop(ctx.currentTime+0.2);
    }
  }
];

const SK_SOUND='alert_sound_id';
let selectedSoundId=localStorage.getItem(SK_SOUND)||'factory_bell';

function playAlert(){ playSound(selectedSoundId); }

function playSound(id){
  try{
    const sound=SOUNDS.find(s=>s.id===id);if(!sound)return;
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const m=ctx.createGain();m.gain.value=0.55;m.connect(ctx.destination);
    sound.fn(ctx,m);
  }catch(e){}
}

function renderSoundGrid(){
  const grid=document.getElementById('soundGrid');if(!grid)return;
  grid.innerHTML=SOUNDS.map(s=>`
    <div class="sound-card${s.id===selectedSoundId?' selected':''}" id="sc_${s.id}" onclick="selectSound('${s.id}')">
      <div class="sc-icon">${s.icon}</div>
      <div class="sc-name">${s.name}</div>
      <div class="sc-desc">${s.desc.replace(/\n/g,'<br>')}</div>
      <div class="sound-preview">
        <button class="btn-preview" onclick="event.stopPropagation();playSound('${s.id}')">▶ 미리듣기</button>
      </div>
    </div>`).join('');
}

function selectSound(id){
  selectedSoundId=id;
  localStorage.setItem(SK_SOUND,id);
  document.querySelectorAll('.sound-card').forEach(c=>c.classList.remove('selected'));
  const el=document.getElementById('sc_'+id);if(el)el.classList.add('selected');
  showToast('✅ 알림음 변경됨');
}

// ══ TOAST ══
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);
}

// ══ CLOCK ══
setInterval(()=>{
  document.getElementById('navTime').textContent=
    new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
},1000);

// ══ REALTIME SYNC via polling ══
let lastPollDate=viewDate;
setInterval(async()=>{
  if(document.getElementById('panel-monitor').classList.contains('active')){
    const fresh=await loadOrders(viewDate);
    const safeFresh=Array.isArray(fresh)?fresh:[];
    const changed=JSON.stringify(safeFresh)!==JSON.stringify(orders.filter(o=>o.date===viewDate));
    if(changed){orders=orders.filter(o=>o.date!==viewDate);orders.push(...safeFresh);renderMonitor();}
  }
},8000);

// ══ INIT ══
(async()=>{
  await loadStaff();
  addItemRow();
  renderMonitor();
})();
</script>
